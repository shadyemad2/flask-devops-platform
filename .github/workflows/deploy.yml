name: CI/CD Build & Deploy

on:
  push:
    branches:
      - main

env:
  BACKEND_IMAGE: shadyemad/flask-devops-platform-backend
  FRONTEND_IMAGE: shadyemad/flask-devops-platform-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push backend image
      run: |
        docker build -t $BACKEND_IMAGE:latest ./backend
        docker push $BACKEND_IMAGE:latest

    - name: Build and push frontend image
      run: |
        docker build -t $FRONTEND_IMAGE:latest ./frontend
        docker push $FRONTEND_IMAGE:latest

    - name: Decode kubeconfig and setup kubectl
      run: |
        echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > kubeconfig
        export KUBECONFIG=$PWD/kubeconfig
        kubectl get nodes

    - name: Rollout restart backend and frontend
      run: |
        export KUBECONFIG=$PWD/kubeconfig
        kubectl rollout restart deployment/backend
        kubectl rollout restart deployment/frontend

